<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For my girl ❤️</title>
    <style>
        :root {
            --accent: #ff4d6d;
            --secondary: #ff758f;
            --dark: #2b2d42;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff0f3; /* Нежно-розовый фон */
            font-family: 'Montserrat', sans-serif;
        }

        /* Анимированный фон */
        #bg {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            color: var(--accent);
            opacity: 0.3;
            user-select: none;
            pointer-events: none;
            animation: move linear infinite;
        }

        @keyframes move {
            from { transform: translateY(110vh) rotate(0deg); }
            to { transform: translateY(-20vh) rotate(360deg); }
        }

        /* Контент */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 20px 20px 60px #d9ccd0, -20px -20px 60px #ffffff;
            text-align: center;
            width: 100%;
            max-width: 350px;
            position: relative;
            z-index: 10;
        }

        h2 { color: var(--dark); font-size: 1.4rem; margin-bottom: 25px; line-height: 1.4; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
        }

        .btn-main {
            background: var(--accent);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        .btn-alt {
            background: #f8f9fa;
            color: #adb5bd;
            position: relative;
        }

        .hidden { display: none; }

        /* Эффект тряски для ошибок */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

<div id="bg"></div>

<div class="container">
    <div id="s1" class="box">
        <h2>Ну привет! Твой любимый человек кое-что подготовил... <br><br>Готова?</h2>
        <div class="btn-group">
            <button class="btn btn-main" onclick="next(1, 2)">Да, конечно! ❤️</button>
            <button class="btn btn-alt" onclick="fakeNo()">Ну... не знаю</button>
        </div>
    </div>

    <div id="s2" class="box hidden">
        <h2>Так, подожди. Важный вопрос: <br><br>Кто тут самая красивая девочка?</h2>
        <div class="btn-group">
            <button class="btn btn-main" onclick="next(2, 3)">Это я, без вариантов ✨</button>
            <button id="runaway" class="btn btn-alt" onmouseover="run(this)" onclick="run(this)">Точно не я</button>
        </div>
    </div>

    <div id="s3" class="box hidden">
        <h2>Ну ладно, убедила) <br><br>Твой подарок заслужил такую хозяйку!</h2>
        <p style="color: #666; margin-bottom: 25px;">Нажимай на кнопку ниже, там ссылка на WB</p>
        <a href="ССЫЛКА_НА_СЕРТИФИКАТ" class="btn btn-main">ЗАБРАТЬ ПОДАРОК 🎁</a>
    </div>
</div>

<script>
    // Создаем сердечки
    const bg = document.getElementById('bg');
    for(let i=0; i<20; i++) {
        const h = document.createElement('div');
        h.className = 'floating-heart';
        h.innerHTML = '❤️';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = (Math.random() * 20 + 10) + 'px';
        h.style.animationDuration = (Math.random() * 3 + 4) + 's';
        h.style.animationDelay = Math.random() * 5 + 's';
        bg.appendChild(h);
    }

    function next(curr, next) {
        document.getElementById('s' + curr).classList.add('hidden');
        document.getElementById('s' + next).classList.remove('hidden');
    }

    function fakeNo() {
        const b = document.querySelector('#s1');
        b.classList.add('shake');
        setTimeout(() => b.classList.remove('shake'), 300);
        alert("Ой, кажется, эта кнопка сломалась. Попробуй нажать на левую! 😉");
    }

    function run(btn) {
        // Кнопка убегает
        const x = Math.random() * (window.innerWidth - btn.offsetWidth - 20);
        const y = Math.random() * (window.innerHeight - btn.offsetHeight - 20);
        
        btn.style.position = 'fixed';
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
        btn.style.width = '150px';
        btn.innerHTML = "Эй! Куда?";
    }
</script>

</body>
</html>
